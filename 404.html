<!doctype html>
<!--
    404 page, served with status 404 for any path the site does not have.

    tools/build.js copies this file to dist/404.html, and tools/serve.js serves
    it for unknown paths, so production and the local preview behave the same.
    The site has a single real entry point, so a missing URL is answered by
    sending the visitor to it rather than by a dead end.

    Two redirects, whichever runs first wins:

      - the meta refresh needs no scripting and no extra request, so it is the
        one that always works;
      - the inline script runs earlier on a normal load and uses replace() so
        the URL that 404'd does not stay in the session history.

    The visible link covers the rest. The page carries its own CSS and pulls in
    nothing: it must render even when the request that got here was for a file
    that no longer exists.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta http-equiv="refresh" content="0; url=/index.html"/>
<meta name="robots" content="noindex"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>404 — kobool</title>
<style>
    :root {
        color-scheme: light dark;
        --kb-page: #f0f0f0;
        --kb-text: #444;
        --kb-muted: #666;
        --kb-link: #1558b0;
    }

    /* Matches shared/theme.scss: the dark palette is applied when the OS asks
       for it, so a redirect never flashes a bright page at a dark-mode visitor. */
    @media (prefers-color-scheme: dark) {
        :root {
            --kb-page: #11151a;
            --kb-text: #e6e9ee;
            --kb-muted: #a9b3bf;
            --kb-link: #7cb7ff;
        }
    }

    html, body {
        margin: 0;
        height: 100%;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background-color: var(--kb-page);
        color: var(--kb-text);
        font-family: "Droid Arabic Naskh", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
    }

    main {
        max-width: 30em;
    }

    .code {
        margin: 0;
        font-size: 3rem;
        font-weight: bold;
        line-height: 1.1;
        color: var(--kb-muted);
    }

    p {
        margin: 0.75em 0;
        line-height: 1.6;
    }

    a {
        color: var(--kb-link);
    }
</style>
<script>
    if (window.location.pathname !== '/index.html') window.location.replace('/index.html');
</script>
</head>
<body>
<main>
    <p class="code">404</p>
    <p>الصفحة غير موجودة. جارٍ تحويلك إلى الصفحة الرئيسية…</p>
    <p lang="en" dir="ltr">Page not found. Redirecting to the home page…</p>
    <p><a href="/index.html">الرئيسية / <span lang="en" dir="ltr">Home</span></a></p>
</main>
</body>
</html>

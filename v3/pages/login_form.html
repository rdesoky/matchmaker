<form onsubmit="require('login').onsubmit();return false;" id="idLoginForm" name="login" class="form_frame">
    <div class="input_title"><span data-string="str:login.login_name"></span>:</div>
	<div><input type="text" name="lname" id="lname" tabindex="1" autofocus></div>
    <div class="input_title"><span data-string="str:login.password"></span>:</div>
	<div><input type="password" name="pw" id="pw" tabindex="2"></div>
	<div class="form_btn_bar"><input type="submit" name="submit" tabindex="3" value="" data-string="str:login.submit" data-string-attr="value" ></div>
</form>
